name: 发布 GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签，例如 v3.2.7'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp_server/package-lock.json

      - name: 安装根项目依赖
        run: npm ci

      - name: 安装 MCP 依赖
        run: npm ci --prefix mcp_server

      - name: 构建网页资源
        run: npm run production

      - name: 构建 MCP 服务
        run: npm run mcp:build

      - name: 运行 MCP 测试
        run: npm run mcp:test

  desktop:
    name: 构建 ${{ matrix.name }} 客户端
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            build_command: npm run desktop:build:win
            artifact_glob: release/*.exe
            artifact_name: stormdmc-windows-client
          - name: Linux
            os: ubuntu-latest
            build_command: npm run desktop:build:linux
            artifact_glob: |
              release/*.AppImage
              release/*.deb
            artifact_name: stormdmc-linux-client
          - name: macOS
            os: macos-latest
            build_command: npm run desktop:build:mac
            artifact_glob: |
              release/*.dmg
              release/*.zip
            artifact_name: stormdmc-macos-client
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp_server/package-lock.json

      - name: 安装根项目依赖
        run: npm ci

      - name: 安装 MCP 依赖
        run: npm ci --prefix mcp_server

      - name: 构建客户端
        run: ${{ matrix.build_command }}

      - name: 上传客户端
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: [validate, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 Windows 客户端
        uses: actions/download-artifact@v4
        with:
          name: stormdmc-windows-client
          path: release

      - name: 下载 Linux 客户端
        uses: actions/download-artifact@v4
        with:
          name: stormdmc-linux-client
          path: release

      - name: 下载 macOS 客户端
        uses: actions/download-artifact@v4
        with:
          name: stormdmc-macos-client
          path: release

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: StormDMC Snowstorm ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            ## 本次更新

            - 更新 Snowstorm 主项目与 VS Code 扩展补丁版本。
            - 集成 MCP 本地服务、浏览器桥接、AI 修改审批、预览截图和工作区原子保存能力。
            - 增加 Windows、Linux、macOS 三平台桌面客户端、`.particle.json` 文件关联、单实例启动和桌面端复制 MCP 配置。
            - 桌面版可识别 MCP 端口占用进程，并在用户确认后解除占用继续启动。
            - 项目仓库、问题反馈、扩展元数据和 Wiki 链接已迁移到 GanquanOnline/Stormdmc。
            - 更新中文 README、MCP 使用指南和 GitHub Wiki。
            - 增加自动构建、测试与 Release 发布工作流。
          files: release/*
