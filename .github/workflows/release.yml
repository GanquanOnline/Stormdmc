name: 发布 GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签，例如 v3.2.8'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp_server/package-lock.json

      - name: 安装根项目依赖
        run: npm ci

      - name: 安装 MCP 依赖
        run: npm ci --prefix mcp_server

      - name: 构建网页资源
        run: npm run production

      - name: 构建 MCP 服务
        run: npm run mcp:build

      - name: 运行 MCP 测试
        run: npm run mcp:test

  desktop:
    name: 构建 ${{ matrix.name }} 客户端
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            build_command: npm run desktop:build:win
            artifact_glob: release/*.exe
            artifact_name: stormdmc-windows-client
          - name: Linux
            os: ubuntu-latest
            build_command: npm run desktop:build:linux
            artifact_glob: |
              release/*.AppImage
              release/*.deb
            artifact_name: stormdmc-linux-client
          - name: macOS
            os: macos-latest
            build_command: npm run desktop:build:mac
            artifact_glob: |
              release/*.dmg
              release/*.zip
            artifact_name: stormdmc-macos-client
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp_server/package-lock.json

      - name: 安装根项目依赖
        run: npm ci

      - name: 安装 MCP 依赖
        run: npm ci --prefix mcp_server

      - name: 构建客户端
        run: ${{ matrix.build_command }}

      - name: 上传客户端
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  android:
    name: 构建 Android 客户端
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: 安装根项目依赖
        run: npm ci

      - name: 设置 Gradle Wrapper 权限
        run: chmod +x android/gradlew

      - name: 构建 Android APK
        run: npm run android:build:apk

      - name: 构建 Android AAB
        run: npm run android:build:aab

      - name: 上传 Android 客户端
        uses: actions/upload-artifact@v4
        with:
          name: stormdmc-android-client
          path: |
            release/*.apk
            release/*.aab
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: [validate, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 Windows 客户端
        uses: actions/download-artifact@v4
        with:
          name: stormdmc-windows-client
          path: release

      - name: 下载 Linux 客户端
        uses: actions/download-artifact@v4
        with:
          name: stormdmc-linux-client
          path: release

      - name: 下载 macOS 客户端
        uses: actions/download-artifact@v4
        with:
          name: stormdmc-macos-client
          path: release

      - name: 下载 Android 客户端
        uses: actions/download-artifact@v4
        with:
          name: stormdmc-android-client
          path: release

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: StormDMC Snowstorm ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            ## 本次更新

            - 更新 Snowstorm 主项目与 VS Code 扩展补丁版本。
            - 新增基于 Capacitor 8 的 Android 客户端，支持触控编辑、安全区域适配和系统返回键。
            - Android 版支持从其他应用打开 JSON，并通过系统分享面板导出粒子 JSON 与纹理 PNG。
            - Release 工作流新增 Android API 36 构建任务，同时发布可安装 APK 和应用商店 AAB。
            - 保留 Windows、Linux、macOS 三平台客户端的矩阵构建、MCP 测试和自动发布流程。
            - 更新中文 README、Android 构建说明、MCP 限制说明和 GitHub Wiki。
            - Android 端当前不启动 MCP 服务，需要 MCP 时请使用桌面客户端或电脑网页版。
          files: release/*
